# EQEP Capture Sample Configuration

# Counter subsystem support
CONFIG_COUNTER=y

# TI AM3352 EQEP counter driver
CONFIG_COUNTER_TI_AM3352_EQEP=y

# GPIO support for pattern generation (if needed)
CONFIG_GPIO=y

# Logging support
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Standard C library support
CONFIG_NEWLIB_LIBC=y

CONFIG_AM62L_EVM_IO_EXPANDER=y